name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    # One-time setup required before the first tag: on PyPI, open hookrecon ->
    # Publishing -> add this GitHub repo as a "trusted publisher"
    # (owner/repo: this repo, workflow: release.yml, environment: pypi).
    # Trusted publishing uses OIDC — no API token stored in GitHub.
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
