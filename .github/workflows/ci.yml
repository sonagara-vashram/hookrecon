name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover tests -v
      - name: Exit-code smoke (no Stripe/DB needed)
        shell: bash
        # GitHub's bash runs with -e -o pipefail: a bare `cmd; rc=$?` dies on the
        # expected non-zero exit, so every probe must use the `|| rc=$?` pattern.
        run: |
          cd "$(mktemp -d)"
          rc=0
          hookrecon check >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || { echo "missing config: expected exit 2, got $rc"; exit 1; }
          echo '{not json' > hookrecon.config.json
          rc=0
          hookrecon check >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || { echo "malformed config: expected exit 2, got $rc"; exit 1; }
          echo "exit-code smoke ok"
